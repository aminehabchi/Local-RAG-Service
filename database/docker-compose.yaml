version: "3.9"

services:
  postgres:
    build: ./postgres
    container_name: pgvector-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rag-network

  pgadmin:
    build: ./admin
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - rag-network

volumes:
  pgdata:

networks:
  rag-network:
