version: "3.9"

services:

  postgres:
    build: ./database/postgres
    container_name: pgvector-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    build: ./database/admin
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-network

  backend:
    build: ./backend
    container_name: rag-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - fastembed-cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-network

  frontend:
    build: ./frontend
    container_name: rag-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - rag-network

volumes:
  pgdata:
  fastembed-cache:

networks:
  rag-network:
